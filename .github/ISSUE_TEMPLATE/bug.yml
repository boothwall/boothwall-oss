name: Bug report
description: Something in BoothWall doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm demo`
        2. Open the wall
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - Wall (browser)
        - Wall (Fire TV app)
        - Upload page
        - Control
        - API
        - Setup or deploy scripts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v3.0.0 or a commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where it runs (Vega Virtual Device, a Fire TV Stick and its model, or a browser), OS and Node version. Leave out passcodes, keys and private addresses.
