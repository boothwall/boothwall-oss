name: Verify public release source

on:
  workflow_dispatch:
    inputs:
      branch_commit:
        description: Exact public release branch commit (40 hex)
        required: true
        type: string
      public_base:
        description: Exact expected public base commit (40 hex)
        required: true
        type: string
      expected_tree:
        description: Exact expected public tree (40 hex)
        required: true
        type: string
      final_commit:
        description: Exact final public merge commit (40 hex)
        required: true
        type: string
      version:
        description: Exact product SemVer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-verification-${{ inputs.branch_commit }}
  cancel-in-progress: false

jobs:
  branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      receipt-digest: ${{ steps.build.outputs.receipt-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout verifier from this workflow revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout exact public branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: "10.20.0"
          run_install: false
      - name: Verify source, run branch checks and build example workers
        id: build
        env:
          PUBLIC_PHASE: branch
          PUBLIC_SOURCE_DIRECTORY: ${{ github.workspace }}/source
          PUBLIC_RECEIPT_DIRECTORY: ${{ runner.temp }}/public-branch-receipt
          PUBLIC_COMMIT: ${{ inputs.branch_commit }}
          PUBLIC_TREE: ${{ inputs.expected_tree }}
          PUBLIC_BASE: ${{ inputs.public_base }}
          PUBLIC_VERSION: ${{ inputs.version }}
        run: node tooling/scripts/release/cli/public-build.cli.mjs build
      - name: Retain unsigned branch packet
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-branch-receipt
          path: ${{ runner.temp }}/public-branch-receipt
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false

  final:
    needs: branch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the same verifier revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout exact final public merge
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.final_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.branch.outputs.artifact-id }}
          path: ${{ runner.temp }}/branch-input
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: "10.20.0"
          run_install: false
      - name: Verify final public tree and branch packet before isolated build
        env:
          PUBLIC_PHASE: final
          PUBLIC_SOURCE_DIRECTORY: ${{ github.workspace }}/source
          PUBLIC_RECEIPT_DIRECTORY: ${{ runner.temp }}/public-final-receipt
          PUBLIC_COMMIT: ${{ inputs.final_commit }}
          PUBLIC_TREE: ${{ inputs.expected_tree }}
          PUBLIC_BASE: ${{ inputs.public_base }}
          PUBLIC_VERSION: ${{ inputs.version }}
          PUBLIC_BRANCH_COMMIT: ${{ inputs.branch_commit }}
          PUBLIC_BRANCH_RECEIPT: ${{ runner.temp }}/branch-input
          PUBLIC_BRANCH_DIGEST: ${{ needs.branch.outputs.receipt-digest }}
        run: node tooling/scripts/release/cli/public-build.cli.mjs build
      - name: Retain unsigned final packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-final-receipt
          path: ${{ runner.temp }}/public-final-receipt
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
